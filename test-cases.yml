---
- summary: |
    Проверка поиска товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта главная страница интернет-магазина
    Пользователь находится в каталоге товаров
  test-data: |
    Ключевое слово = lipstick
  steps:
    - Ввести в поле поиска значение "lipstick"
    - Дождаться обновления списка товаров
  expected-result: |
    В каталоге отображаются товары, соответствующие введенному ключевому слову

- summary: |
    Проверка поиска товаров по категории
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта главная страница интернет-магазина
    Пользователь находится в каталоге товаров
  test-data: |
    Категория = fragrances
  steps:
    - Открыть список категорий
    - Выбрать категорию "fragrances"
  expected-result: |
    В каталоге отображаются только товары выбранной категории

- summary: |
    Проверка фильтрации товаров
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница интернет-магазина
    Отображается список товаров
  test-data: |
    brand = "Essence"
  steps:
    - В списке фильтров по бренду выбрать "Essence"
  expected-result: |
    На странице должны остаться только товары, соответствующие выбранному фильтру

- summary: |
    Проверка фильтрации товаров по цене
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница интернет-магазина
    Отображается список товаров
  test-data: |
    Данные не требуются
  steps:
    - В поле фильтрации по цене указать диапазон от 100 до 300
    - Применить фильтр
  expected-result: |
    В каталоге отображаются только товары, цена которых входит в указанный диапазон

- summary: |
    Проверка отображения списка товаров в каталоге
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Данные не требуются
  steps:
    - Открыть главную страницу магазина
    - Просмотреть список товаров
  expected-result: |
    На странице должен отображаться каталог товаров с основными данными по каждому товару

- summary: |
    Проверка открытия карточки товара
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница интернет-магазина
    В каталоге есть хотя бы один товар
  test-data: |
    Товар = Powder Canister
  steps:
    - Нажать на карточку товара "Powder Canister"
  expected-result: |
    Открывается страница товара "Powder Canister" с подробной информацией о нем

- summary: |
    Проверка добавления товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    любой доступный товар
  steps:
    - Нажать кнопку добавления товара в корзину
  expected-result: |
    Выбранный товар добавлен в корзину

- summary: |
    Проверка просмотра содержимого корзины
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    В корзину добавлен хотя бы один товар
  test-data: |
    любой ранее добавленный товар
  steps:
    - Открыть корзину
  expected-result: |
    В корзине отображается ранее добавленный товар

- summary: |
    Проверка добавления нескольких товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    -
  steps:
    - Добавить в корзину несколько товаров
    - Открыть корзину
  expected-result: |
    В корзине отображаются оба добавленных товара

- summary: |
    Проверка переключения языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Language = Russian
  steps:
    - Открыть переключатель языка
    - Выбрать русский язык
  expected-result: |
    Язык элементов интерфейса должен измениться на русский

- summary: |
    Проверка переключения языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Language = Spanish
  steps:
    - Открыть переключатель языка
    - Выбрать испанский язык
  expected-result: |
    Язык элементов интерфейса должен измениться на испанский

- summary: |
    Проверка отображения сайта на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Открыт сайт на мобильном устройстве или в режиме эмуляции мобильного устройства в браузере
  test-data: |
    Разрешение = 430х932
  steps:
    - Открыть сайт в мобильном разрешении в devtools
    - Проверить отображение главной страницы
    - Проверить отображение каталога, карточки товара и корзины
  expected-result: |
    Сайт должен корректно отображаться в мобильной версии без горизонтальной прокрутки и наложения элементов

- summary: |
    Проверка поиска несуществующего товара
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites:
    -
  test-data: |
    -
  steps:
    - Ввести в поле поиска несущетсвующий товар "lego"
  expected-result: |
    Отображается сообщение "Nothing found!"

- summary: |
    Проверка защищенности данных при работе сайта по HTTPS
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыт браузер
  test-data: |
    URL = https://products-store.hexlet.app/
  steps:
    - Открыть сайт
    - Проверить наличие защищенного соединения в адресной строке браузера
  expected-result: |
    Сайт должен открываться по защищенному протоколу HTTPS

- summary: |
    Проверка доступа к сайту без VPN
  requirement: |
    Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
  prerequisites: |
    VPN отключен
    Доступно интернет-соединение
  test-data: |
    URL = https://products-store.hexlet.app/
  steps:
    - Отключить VPN
    - Открыть сайт по прямой ссылке
  expected-result: |
    Сайт должен успешно открываться и быть доступным пользователю без использования VPN

- summary: |
    Проверка совместимости сайта с последней версией Safari
  requirement: |
    Сайт нужно протестировать на совместимость с последними версиями браузеров
  prerequisites: |
    Установлена последняя версия браузера Safari
  test-data: |
    Браузер = Safari
  steps:
    - Открыть сайт в Safari
    - Проверить отображение главной страницы
    - Проверить поиск, фильтрацию, карточку товара и корзину
  expected-result: |
    Сайт должен корректно работать и отображаться в последней версии Safari

- summary: |
    Проверка совместимости сайта с последней версией Google Chrome
  requirement: |
    Сайт нужно протестировать на совместимость с последними версиями браузеров
  prerequisites: |
    Установлена последняя версия браузера Google Chrome
  test-data: |
    Браузер = Google Chrome
  steps:
    - Открыть сайт в Google Chrome
    - Проверить отображение главной страницы
    - Проверить поиск, фильтрацию, карточку товара и корзину
  expected-result: |
    Сайт должен корректно работать и отображаться в последней версии Google Chrome

