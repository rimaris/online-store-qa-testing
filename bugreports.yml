---
- summary: |
     Товары не отображаются на главной странице при отключении фильтра "In stock"
  environment: |
    OS: macOS 15.6.1 
    Google Chrome 145.0
  steps-to-reproduce: |
    1. Отключить фильтр "In stock"
  expected-result: |
    На странице сайта показаны все товары (в наличии/не в наличии)
  actual-result: |
    Товары не отображаются

- summary: |
    Не отображается иконка английского языка в переключателе языка сайта
  environment: |
    OS: macOS 15.6.1 
    Google Chrome 145.0
  steps-to-reproduce: |
    1. Открыть главную страницу сайта
    2. Нажать на кнопку выбора языка "Language"
  expected-result: |
    В списке языков отображается иконка английского языка
  actual-result: |
    Иконка английского языка отсутствует

- summary: |
    Не переведено описание и категории товаров на русский
  environment: |
    OS: macOS 15.6.1 
    Google Chrome 145.0
  steps-to-reproduce: |
    1. Выбрать русский язык
  expected-result: |
    Весь сайт переведен на русский язык
  actual-result: |
    Описание товаров и названия категорий товаров не переведены на русский язык

- summary: |
    Ошибка 500 при оформлении заказа
  environment: |
    OS: macOS 15.6.1 
    Google Chrome 145.0
  steps-to-reproduce: |
    1. Добавить товар в корзину
    2. Открыть DevTools (Network)
    3. Перейти в корзину и нажать на кнопку "Checkout"
  expected-result: |
    Перенаправление на страницу с оплатой
  actual-result: |
    Появляется окно с информацией о заказе. Не происходит перенаправление на страницу с оплатой.
    В DevTools (Network) отображается ошибка 500 в запросе на получение заказа.
